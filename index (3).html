<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="favicon.png">
<title>JLOS</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f3;color:#26312b;font-family:'Helvetica Neue',Arial,'Noto Sans',sans-serif;font-weight:300}main{max-width:1000px;margin:auto;padding:20px 16px 28px}header{display:flex;align-items:center;gap:12px;padding:8px 0 25px;position:relative}.mark{width:13px;height:36px;background:#a95e4b;flex:none}.brand{font-size:clamp(40px,9vw,76px);letter-spacing:-.075em;font-weight:300;line-height:.9}.sub{font-size:clamp(10px,2.5vw,15px);line-height:1.15;max-width:100px}.tools{margin-left:auto;display:flex;align-items:center;gap:8px}button{font:inherit;color:inherit;background:none;border:1px solid #26312b;cursor:pointer;padding:7px;min-height:36px}button.active{background:#26312b;color:white}.menu{border:0;font-size:25px}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(9, minmax(52px, min(12vw,100px)));background:#26312b;gap:1px;border:1px solid #26312b;position:relative}.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:clamp(9px,3vw,26px);text-align:left;border:0;min-height:0;text-decoration:none;color:inherit;background:#f8f7f3;cursor:pointer}.tile:hover,.tile:focus-visible{outline:3px solid #26312b;outline-offset:-5px;z-index:2}.tile h2{font-size:clamp(17px,5vw,46px);line-height:1.02;font-weight:300;letter-spacing:-.045em;margin:0;overflow-wrap:normal}.tile small{font-size:clamp(11px,2.7vw,20px);font-weight:400}.arrow{align-self:flex-end;font-size:clamp(18px,5vw,40px);line-height:1}.yellow{background:#aebcae}.blue{background:#38493d;color:white}.red{background:#a95e4b}.yazi{grid-area:2/2/5/5}.glyph{grid-area:2/5/5/7;display:grid;place-items:center;background:#f8f7f3;font-family:'Yu Mincho','Noto Serif CJK JP',serif;font-size:clamp(65px,22vw,190px);line-height:1}.rail{grid-area:1/1/5/2;background:#f8f7f3;overflow:hidden}.topline{grid-area:1/2/2/7;background:#f8f7f3;overflow:hidden}.exercise{grid-area:5/1/8/4}.arc{grid-area:5/4/7/5;background:#f8f7f3;overflow:hidden;position:relative}.arc:after{content:'';position:absolute;width:200%;aspect-ratio:1;bottom:0;left:0;border-radius:100%;background:#a95e4b}.hira{grid-area:5/5/6/7}.kata{grid-area:6/5/7/7}.hira,.kata{padding:8px;display:flex;flex-direction:row;align-items:center;gap:3px;flex-wrap:wrap}.hira h2,.kata h2{font-size:clamp(13px,3.7vw,32px)}.hira .arrow,.kata .arrow{font-size:18px}.kanji{grid-area:8/1/10/3}.stripe{grid-area:8/3/10/4;background:#f8f7f3}.trivia{grid-area:7/4/10/7}.bottom{display:grid;grid-template-columns:1fr 3fr 1fr;border:2px solid #26312b;border-top:0;min-height:150px;gap:2px;background:#26312b}.bottom .tile{min-height:150px}.bottom .shape{background:#aebcae;position:relative;overflow:hidden}.bottom .shape:after{content:'';position:absolute;width:200%;aspect-ratio:1;border-radius:50%;background:#f8f7f3;top:-30%;left:-100%}.bottom .end{background:#a95e4b;position:relative}.stroke{position:absolute;right:9%;bottom:10%;width:34%;height:65%;pointer-events:none}.bottom h2{max-width:70%}footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:18px 0;color:#626b62}dialog{max-width:90%;border:2px solid #26312b;background:#f8f7f3;padding:25px}dialog::backdrop{background:#0006}dialog a{display:block;color:#38493d;margin:15px 0}dialog p{line-height:1.5} @media(min-width:700px){main{padding:30px 40px}.board{grid-template-rows:repeat(9,75px)}} @media(prefers-reduced-motion:no-preference){.tile{transition:filter .15s}.tile:hover{filter:brightness(.96)}}
.ornament{background:#f8f7f3;padding:0;overflow:hidden;display:block}.ornament svg{display:block}.exercise h2{font-size:clamp(15px,4.5vw,42px)}.trivia h2{font-size:clamp(17px,4.6vw,42px)}.red{color:#fff}
/* Prototype 03: six-column asymmetric mosaic, with practice as the largest entrance. */
.board{grid-template-rows:repeat(10,minmax(48px,min(12vw,100px)))}
.rail{grid-area:1/1/5/2}.topline{grid-area:1/2/2/7}
.exercise{grid-area:2/2/6/7}.exercise h2{font-size:clamp(23px,7vw,65px);max-width:100%}.exercise small{position:relative;z-index:1}.exercise .arrow{position:relative;z-index:1}
.exercise .gamegraphic{position:absolute;right:9%;bottom:8%;width:45%;height:66%;pointer-events:none;opacity:.8}
.yazi{grid-area:6/1/9/4}.glyph{grid-area:6/4/9/6;font-size:clamp(48px,17vw,150px)}
.arc{grid-area:5/1/6/2}.hira{grid-area:6/6/7/7}.kata{grid-area:7/6/9/7}
.kanji{grid-area:9/1/11/2}.stripe{grid-area:9/2/11/3}.trivia{grid-area:9/3/11/7}
.trivia h2{font-size:clamp(17px,5vw,39px)}
@media(min-width:700px){.board{grid-template-rows:repeat(10,75px)}}
@media(max-width:390px){header{gap:7px}.tools{gap:4px}.brand{font-size:40px}.sub{font-size:10px}.mark{width:8px}.tools button{padding:5px}}
.tile.glyph{display:flex;align-items:center;justify-content:center;padding:clamp(5px,1.5vw,16px);font-family:inherit;gap:4px}.glyphchar{font-family:"Yu Mincho","Noto Serif CJK JP",serif;line-height:1}.glyphlabel{display:flex;align-items:center;justify-content:space-between;gap:3px;width:100%;font-size:clamp(10px,2.8vw,18px);font-weight:300;line-height:1.15}.glyphlabel>span:first-child{overflow-wrap:normal}.glyphlabel>span:last-child{flex:none}</style></head><body><main><header><div class="mark"></div><div class="brand">JLOS</div><div class="sub">Japanese<br>Language<br>Open Space</div><div class="tools"><button id="tr" class="active" onclick="lang('tr')">TR</button><button id="jp" onclick="lang('ja')">JP</button></div></header><section class="board" aria-label="JLOS"><div class="rail" aria-hidden="true"><svg viewBox="0 0 100 300" preserveAspectRatio="none" width="100%" height="100%"><path d="M35 300V120Q35 72 100 72" fill="none" stroke="#38493d" stroke-width="8"/></svg></div><div class="topline" aria-hidden="true"><svg width="100%" height="100%" viewBox="0 0 500 80" preserveAspectRatio="none"><path d="M180 80L300 0" stroke="#26312b" stroke-width="1"/><rect x="300" width="200" height="80" fill="#a95e4b"/></svg></div><button class="tile blue exercise" onclick="section('exercise')"><h2 data-tr="Alıştırmalar" data-ja="鍛錬の場">Alıştırmalar</h2><small data-tr="鍛錬の場" data-ja="Alıştırmalar">鍛錬の場</small><svg class="gamegraphic" viewBox="0 0 160 140" aria-hidden="true"><g fill="none" stroke="#fbfcf9" stroke-width="1.2"><path d="M85 9L121 119L27 51L143 51L49 119Z"/></g><g fill="#aebcae"><circle cx="85" cy="9" r="4"/><circle cx="121" cy="119" r="4"/><circle cx="27" cy="51" r="4"/><circle cx="143" cy="51" r="4"/><circle cx="49" cy="119" r="4"/></g></svg><span class="arrow">↗</span></button><button class="tile yellow yazi" onclick="section('yazi')"><h2 data-tr="Yazıya Dair" data-ja="文字について">Yazıya Dair</h2><small data-tr="文字について" data-ja="Yazıya Dair">文字について</small><span class="arrow">↗</span></button><button class="tile glyph" onclick="section('stroke')"><span class="glyphchar" lang="ja">画</span><span class="glyphlabel"><span data-tr="Temel Çizgiler" data-ja="基本画">Temel Çizgiler</span><span aria-hidden="true">↗</span></span></button><div class="arc" aria-hidden="true"></div><div class="hira ornament" aria-hidden="true"><svg viewBox="0 0 180 60" width="100%" height="100%" preserveAspectRatio="none"><rect width="180" height="60" fill="#aebcae"/></svg></div><div class="kata ornament" aria-hidden="true"><svg viewBox="0 0 180 60" width="100%" height="100%" preserveAspectRatio="none"></svg></div><div class="kanji ornament" aria-hidden="true"><svg viewBox="0 0 120 120" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><circle cx="60" cy="60" r="43" fill="#aebcae"/></svg></div><div class="stripe" aria-hidden="true"></div><button class="tile red trivia" onclick="section('trivia')"><h2 data-tr="İlginç Bilgiler" data-ja="雑学至上主義">İlginç Bilgiler</h2><small data-tr="雑学至上主義" data-ja="İlginç Bilgiler">雑学至上主義</small><span class="arrow">↗</span></button></section><footer><span>go47ankara</span><span>JLOS</span></footer></main><dialog id="dlg"><h2 id="dt"></h2><p id="msg"></p><button onclick="dlg.close()" id="close">Kapat</button></dialog><script>let current='tr';const names={yazi:['Yazıya Dair','文字について'],exercise:['Alıştırmalar','鍛錬の場'],hira:['Hiragana','ひらがな'],kata:['Katakana','カタカナ'],kanji:['Kanji','漢字'],trivia:['İlginç Bilgiler','雑学至上主義'],stroke:['Temel Çizgiler','基本画']};function lang(l){current=l;try{localStorage.setItem('jlos_ui_language',l)}catch(_){};document.documentElement.lang=l;document.querySelectorAll('[data-tr]').forEach(e=>e.textContent=e.dataset[l]);tr.classList.toggle('active',l==='tr');jp.classList.toggle('active',l==='ja');document.getElementById('close').textContent=l==='tr'?'Kapat':'閉じる'}const routes={exercise:'training.html',yazi:'JLOS_yaziya_dair_top_v14_embedded_carousel.html',stroke:'JLOS_basic_strokes_15_final.html'};function section(k){if(routes[k]){try{localStorage.setItem('jlos_ui_language',current)}catch(_){} location.href=routes[k];return;}dt.textContent=names[k][current==='tr'?0:1];msg.textContent=current==='tr'?'Hazırlanıyor.':'準備中です。';dlg.showModal()}try{const saved=localStorage.getItem('jlos_ui_language');if(saved==='ja'||saved==='tr')lang(saved)}catch(_){};</script></body></html>
