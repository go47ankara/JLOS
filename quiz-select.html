<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>地名クイズ | JLOS</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; padding: 2rem 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f9f9f9; color: #333; font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif; text-align: center; }
    main { width: 100%; max-width: 380px; }
    h1 { font-size: clamp(1.8rem, 6vw, 2.3rem); margin: 0 0 .6rem; }
    .subtitle { color: #666; margin: 0 0 2rem; }
    nav { display: grid; gap: 1rem; }
    .quiz-button { display: flex; min-height: 3.25rem; align-items: center; justify-content: center; padding: .75rem 1rem; border-radius: 8px; background: #007acc; color: white; text-decoration: none; font-size: 1.1rem; font-weight: 600; }
    .quiz-button:hover, .quiz-button:focus-visible { background: #005fa3; }
    .quiz-button:focus-visible, .back:focus-visible { outline: 3px solid #333; outline-offset: 3px; }
    .back { display: inline-block; margin-top: 2rem; color: #006aaf; }
    #user-info { margin-top: 2.5rem; font-size: .88rem; color: #666; overflow-wrap: anywhere; }
    #user-info p { margin: .6rem 0; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    const firebaseConfig = {
      apiKey: "AIzaSyCi3cB7GdpgdEIZrxxnoyHPpeINIJ6sSMw",
      authDomain: "quizapp-jlos.firebaseapp.com",
      projectId: "quizapp-jlos"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    onAuthStateChanged(auth, user => {
      const username = localStorage.getItem("username");
      const uidDisplay = document.getElementById("uid-display");
      const nameEl = document.getElementById("username-display");
      if (user) {
        if (nameEl) nameEl.textContent = username ? `登録名：${username}` : "ログイン中（未登録ユーザー）";
        if (uidDisplay) uidDisplay.textContent = `UID：${user.uid}`;
      } else {
        if (nameEl) nameEl.textContent = "ゲストモードでプレイ中";
        if (uidDisplay) uidDisplay.textContent = "";
      }
    });
  </script>
</head>
<body>
  <main>
    <h1>地名クイズ</h1>
    <p class="subtitle">難易度を選んでください</p>
    <nav aria-label="地名クイズの難易度">
      <a class="quiz-button" href="quiz_beginner.html">初級</a>
      <a class="quiz-button" href="quiz_intermediate.html">中級</a>
      <a class="quiz-button" href="quiz_advanced.html">上級</a>
    </nav>
    <a class="back" href="training.html">← 鍛錬の場へ戻る</a>
    <div id="user-info">
      <p id="username-display"></p>
      <p id="uid-display"></p>
    </div>
  </main>
</body>
</html>
