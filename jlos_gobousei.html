<style>
/* Reuse JLOS's KanjiStrokeOrders webfont without bundling another font file.
   Local relative path works after deployment to JLOS; remote URL works when
   the standalone HTML prototype is opened from a phone's Downloads folder. */
@font-face {
  font-family: 'JLOS-KanjiStrokeOrders';
  src: url('./KanjiStrokeOrders_allmodes.woff2') format('woff2'),
       url('https://go47ankara.github.io/JLOS/KanjiStrokeOrders_allmodes.woff2') format('woff2');
  font-style: normal;
  font-weight: 400;
  font-display: swap;
}

:root {--kanji-face:'Noto Serif JP','Noto Serif CJK JP','Hiragino Mincho ProN','Yu Mincho',serif;}
:root {color-scheme:dark; --bg:#070f20;--text:#f4f4ef;--muted:#a8b8cc;--line:#91c7d2;--gold:#e6d6a6;--white:#f0ffff;--panel:rgba(12,26,45,.76)}
*{box-sizing:border-box} html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100dvh;color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP","Noto Sans",sans-serif;background:radial-gradient(ellipse at 50% 40%,#142b43 0%,#0a172a 36%,#060c19 77%,#040810 100%);overflow-x:hidden}
body::before {content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#d9f9ff 0.7px,transparent .7px);background-size:46px 41px;opacity:.075}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent} button:focus-visible{outline:2px solid #b2edfa;outline-offset:3px}
.app{position:relative;max-width:470px;margin:auto;padding:env(safe-area-inset-top) 17px env(safe-area-inset-bottom);min-height:100dvh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:18px;min-height:57px}
.brand{font-size:12px;color:#91a7b7;letter-spacing:.22em;font-weight:600}.brand b{color:#e3dfcf;font-weight:700}
.lang{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid #445669;border-radius:100px;background:#080e1c}
.lang button{border:0;border-radius:100px;padding:7px 10px;background:transparent;color:#9eb2c4;font-size:12px;white-space:nowrap}.lang button.active{background:#22394c;color:#eaf7fa;box-shadow:inset 0 0 0 1px #57778b}
.page{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:stretch;min-height:0}.screen{width:100%;animation:appear .35s both}
.headline{text-align:center;margin:20px 0 0}.eyebrow{font-size:11px;letter-spacing:.28em;color:#89b5be;margin-bottom:10px}.headline h1{font-family:"Noto Serif JP",serif;font-size:clamp(32px,10vw,46px);font-weight:500;letter-spacing:.24em;margin:0 0 7px;padding-left:.24em;text-shadow:0 0 22px #70d6e84f}.subtitle{margin:0;font-size:13px;letter-spacing:.09em;color:#c4d6de}
.glyph-stage{position:relative;width:min(100%,370px);aspect-ratio:1;margin:4px auto -4px;isolation:isolate}
.diagram{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 11px rgba(125,220,232,.12))}
.halo{fill:none;stroke:#86a7b3;opacity:.32}.edge{fill:none;stroke:#b2eaf1;stroke-width:1.05;opacity:.53}.star{fill:none;stroke:#bceaf0;stroke-width:1.7;opacity:.76}.center-figure{fill:none;stroke:#c5a874;stroke-width:1.2;opacity:.56}
.ring-spin{transform-origin:200px 200px;animation:spin 100s linear infinite}.ring-spin-back{transform-origin:200px 200px;animation:spinReverse 150s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}
.glyph-title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;gap:5px}
.glyph-title span:first-child{font-family:serif;font-size:26px;color:#f5e9cb;text-shadow:0 0 21px #afdecf88}.glyph-title span:last-child{font-size:10px;letter-spacing:.16em;color:#94afbf}
.choose{margin:0 auto 0;width:min(100%,395px);padding:0 2px}.choose-heading{text-align:center;color:#a8bfcb;letter-spacing:.09em;font-size:12px;margin:3px 0 11px}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.level{min-width:0;min-height:83px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;border:1px solid #57697b;background:linear-gradient(145deg,rgba(26,47,68,.74),rgba(10,20,35,.82));border-radius:12px;color:#edf9fc;transition:background .2s,transform .2s,border-color .2s}
.level:active{transform:scale(.96)}.level:hover{border-color:#94cfce;background:rgba(25,55,73,.85)}
.level .number{font:16px Georgia,serif;letter-spacing:.16em;color:#dcd0a8}.level .name{font-size:15px;font-weight:600}
.footer{padding:18px 0 19px;text-align:center;font-size:10px;letter-spacing:.09em;color:#647f91}
.game-top{margin:16px 0 2px;display:flex;justify-content:space-between;gap:8px;color:#b8cfda;font-size:12px;letter-spacing:.06em}
.question-heading{text-align:center;margin:20px 0 6px;min-height:26px;font-size:16px;letter-spacing:.045em;font-weight:600}
.progress{display:flex;justify-content:center;gap:7px;margin:1px 0 4px}.progress i{display:block;height:3px;width:32px;border-radius:20px;background:#394a5c}.progress i.done{background:#a6c7c9}.progress i.current{background:#e0d2a4}
.kanji-stage{width:min(100%,380px);position:relative;aspect-ratio:1;margin:0 auto;isolation:isolate}
.kanji-stage .diagram{position:absolute;inset:0;transition:filter .3s}
.kanji-node{position:absolute;transform:translate(-50%,-50%);width:18.8%;aspect-ratio:1;min-width:50px;max-width:72px;border-radius:50%;border:1px solid #b1c7c4;background:radial-gradient(circle at 45% 25%,#344e5b,#14273b 67%,#091526);box-shadow:0 0 0 4px rgba(130,182,184,.07),0 0 14px rgba(109,203,214,.18);color:#fffdf4;font-size:clamp(30px,9.5vw,39px);font-family:var(--kanji-face);font-weight:600;line-height:1;display:flex;justify-content:center;align-items:center;transition:background .3s,box-shadow .35s,color .3s,opacity .4s,transform .68s cubic-bezier(.18,.85,.22,1),filter .4s;touch-action:manipulation;will-change:transform}
/* A chosen character travels to the center, then the diagram responds. */
.kanji-node:disabled{cursor:default}
.kanji-stage.stage-thinking .kanji-node:not(.to-center){opacity:.32;filter:brightness(.7);transform:translate(-50%,-50%) scale(.9)}
.kanji-node.to-center{z-index:4;transform:translate(calc(-50% + var(--move-x,0px)),calc(-50% + var(--move-y,0px))) scale(1.35);border-color:#f7e4b5;background:radial-gradient(circle at 40% 22%,#607787,#273d50 70%,#152134);box-shadow:0 0 0 7px #cbd9c11e,0 0 35px #d5f8f0b3,0 0 70px #aecfd26b;color:#fff8de}
.kanji-node.to-center.rejected{background:#453447;border-color:#cd99c7;box-shadow:0 0 0 7px #aa77b71c,0 0 36px #b278d8b3;animation:rejectPulse .28s ease-in-out 2}
.center-flare{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.45);width:27%;aspect-ratio:1;border-radius:50%;border:1px solid #e6d4a0;box-shadow:0 0 20px #cfefff70, inset 0 0 17px #c7d6cb55;opacity:0;pointer-events:none;transition:opacity .36s,transform .7s;z-index:1}
.stage-thinking .center-flare{opacity:.9;transform:translate(-50%,-50%) scale(1.15)}
.stage-rejected .center-flare{border-color:#c591cc;box-shadow:0 0 24px #c591cc88}
.stage-complete .center-flare{opacity:.95;transform:translate(-50%,-50%) scale(1.58);border-color:#f4dca9;box-shadow:0 0 25px #fff3c780,0 0 75px #d9e8d75e,inset 0 0 22px #d9e8d733;animation:victoryHalo 3.4s ease-in-out infinite}
.kanji-node.vanish{opacity:0!important;transform:translate(calc(-50% + var(--move-x,0px)),calc(-50% + var(--move-y,0px))) scale(.2)!important;filter:blur(8px)}
.kanji-node.wrong{animation:shake .3s ease-in-out;background:#3b273e;box-shadow:0 0 18px #c48cbd70;border-color:#c7a6c9}
.kanji-node.ally{border-color:#e2d2a6;box-shadow:0 0 22px #fff0bb88,0 0 0 5px #d6b87a25;background:#3e413c}
.kanji-node.out{color:transparent;border-color:#dcd5ac;box-shadow:0 0 22px #dcb98d;transform:translate(-50%,-50%) scale(.72);opacity:.23}
/* Five independent strokes are lit in a circuit starting at the selected vertex. */
.star-trace{fill:none;stroke:#ffe8b1;stroke-width:4;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;opacity:0;filter:drop-shadow(0 0 4px #fff3c7) drop-shadow(0 0 9px #f0ce8f)}
.stage-activating .star-trace{animation:starTrace .32s ease-out both;animation-delay:calc(var(--trace-order, 0) * 120ms)}
.stage-activating .diagram{filter:drop-shadow(0 0 16px rgba(255,220,152,.4))}
@keyframes starTrace{0%{stroke-dashoffset:100;opacity:0}15%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
.stage-complete .diagram{filter:drop-shadow(0 0 17px #f9e4b088)}
.stage-complete .star-trace{stroke-dashoffset:0;opacity:.94;stroke-width:2.8}
.stage-complete .ring-spin{animation-duration:36s}
/* The selected outlier remains enthroned in the center until Next. */
.stage-complete .kanji-node.to-center{z-index:10;border:2px solid #fff0c9;background:radial-gradient(circle at 40% 23%,#8393a1,#34495f 61%,#152b41);color:#fff8d6;box-shadow:0 0 0 6px #d0bd9142,0 0 33px 13px #e5e5b27a,0 0 72px 25px #bcecf075;animation:victoryCore 2.9s ease-in-out infinite}
.stage-complete .kanji-node.to-center::after{content:"";position:absolute;inset:-15px;border:1px solid #e9d6a0a8;border-radius:50%;pointer-events:none;animation:victoryHalo 3s ease-in-out infinite}
.kanji-node.dissolve{pointer-events:none;opacity:0!important;filter:blur(7px) brightness(2);transform:translate(-50%,-50%) scale(.22)!important;transition:opacity .68s ease-in,filter .68s ease-in,transform .68s ease-in!important}
.sparkfield{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:visible}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff4c7;box-shadow:0 0 7px 2px #f9d79f,0 0 15px #bddff5;opacity:0;animation:sparkFly .86s cubic-bezier(.14,.56,.35,1) both;animation-delay:var(--delay,0ms)}
.kanji-stage.stage-complete + .feedback .status{font-family:Georgia,"Noto Serif JP",serif;font-size:23px;letter-spacing:.13em;color:#fbe7b5;text-shadow:0 0 20px #f6dca877}
@keyframes sparkFly{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}18%{opacity:1}72%{opacity:.85}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.18)}}
@keyframes victoryHalo{0%,100%{opacity:.7;filter:brightness(.9)}50%{opacity:1;filter:brightness(1.3)}}
@keyframes victoryCore{0%,100%{box-shadow:0 0 0 6px #d0bd9142,0 0 33px 13px #e5e5b27a,0 0 72px 25px #bcecf075}50%{box-shadow:0 0 0 9px #f2d8a260,0 0 39px 18px #ffefb49c,0 0 90px 30px #bcecf085}}
.kanji-node[data-index="0"]{left:50%;top:16.3%}.kanji-node[data-index="1"]{left:82%;top:39.5%}.kanji-node[data-index="2"]{left:70%;top:77.3%}.kanji-node[data-index="3"]{left:30%;top:77.3%}.kanji-node[data-index="4"]{left:18%;top:39.5%}
.feedback{min-height:108px;width:min(100%,400px);margin:2px auto 0;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:8px;text-align:center}
.feedback .status{font-size:14px;color:#e4d8ae;line-height:1.5}.feedback .explanation{color:#cad8df;font-size:13px;line-height:1.55}
.primary{padding:10px 32px;border:1px solid #bbd3d1;border-radius:999px;background:#253f4c;color:#f3f6e7;min-width:154px;min-height:43px;box-shadow:0 0 16px #86c7c42b}
.back{background:transparent;border:0;color:#8cafbf;text-decoration:underline;text-underline-offset:3px;font-size:12px;padding:10px}
.result-box{text-align:center;margin:25px auto 12px;max-width:340px}.result-box h2{font-family:serif;font-size:30px;letter-spacing:.07em;font-weight:500;color:#f3e5be}.result-box p{line-height:1.8;color:#c4d3dc;font-size:14px}
.hide{display:none!important}
@keyframes rejectPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.7)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinReverse{to{transform:rotate(-360deg)}}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes shake{0%,100%{translate:0}20%{translate:-4px}40%{translate:4px}60%{translate:-3px}80%{translate:2px}}
@media (max-height:760px){.headline{margin-top:8px}.glyph-stage{width:min(100%,315px)}.choose-heading{margin-top:0}.level{min-height:72px}.footer{padding:11px 0}.question-heading{margin-top:8px}.kanji-stage{width:min(100%,315px)}.feedback{min-height:90px}}
@media (max-width:340px){.app{padding-left:10px;padding-right:10px}.kanji-node{min-width:48px}.level .name{font-size:13px}}

.glyph-pick:active{transform:scale(.95)}.glyph-pick .glyph{font:600 clamp(28px,8.2vw,33px)/1.2 var(--kanji-face)}.glyph-pick .gloss{font-size:10px;line-height:1.15;color:#aebfc8;text-wrap:balance;overflow-wrap:anywhere;max-width:100%}

.review-card .card-result .dot{font-size:12px}
.practice-screen{width:100%;padding:22px 0 25px;text-align:center}
.practice-kicker{font-size:11px;letter-spacing:.22em;color:#8eb6c3;margin-bottom:8px}
.practice-title{margin:0;color:#f3e6c7;font:500 29px/1.35 Georgia,'Noto Serif JP',serif}
.practice-note{margin:12px auto;color:#b5cbd4;font-size:13px;line-height:1.65;max-width:300px}
.practice-card{position:relative;overflow:hidden;margin:17px 0 15px;min-height:280px;border-radius:21px;border:1px solid #a6a78a88;background:radial-gradient(circle at center,#1c4552 0%,#11273b 48%,#0d1b2f 100%);box-shadow:0 15px 42px #0005;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:25px 15px}
.practice-card::before{content:'';position:absolute;width:234px;height:234px;border:1px solid #a5d2d053;border-radius:50%;box-shadow:0 0 0 17px #adceca13,0 0 0 34px #a6c1bf0d,0 0 27px #9ad4d42a;pointer-events:none}
.practice-card::after{content:'✧      ✧      ✧';position:absolute;top:32px;color:#d0d1a981;letter-spacing:30px;font-size:12px;pointer-events:none}
.practice-glyph{position:relative;z-index:1;font:400 clamp(112px,33vw,142px)/1.25 'JLOS-KanjiStrokeOrders',var(--kanji-face);color:#fff3d5;text-shadow:0 0 35px #d9ecca68}
.practice-answer{position:relative;z-index:1;min-height:42px;margin-top:4px;font-size:19px;line-height:1.4;color:#ffe5ae;font-weight:600}
.practice-answer-label{display:block;color:#adc9d0;font-size:11px;letter-spacing:.08em;margin-bottom:5px;font-weight:400}
.practice-answer.is-hidden{visibility:hidden}
.practice-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.practice-controls .primary,.practice-controls .secondary-button{padding:12px 9px;min-height:49px;font-size:14px}
.practice-controls .full{grid-column:1 / -1}
.practice-progress{margin-top:10px;color:#9fbdc9;font-size:12px}
.practice-done-icon{font:62px/1 Georgia,serif;color:#f5e0b3;text-shadow:0 0 28px #f5d79588;margin:15px 0}
.practice-back{display:block;margin:15px auto 0;padding:12px 16px;border:none;background:transparent;color:#aac7d2;text-decoration:underline;text-underline-offset:3px;font-size:13px}
@media(max-width:345px){.practice-card{min-height:240px}.practice-glyph{font-size:100px}}

/* v1.2: unobtrusive sound control. The 50-question data stays unchanged. */
.top-controls{display:flex;align-items:center;gap:7px;flex-shrink:0}
.sound-toggle{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:53px;height:33px;padding:0 7px;border:1px solid #587784;border-radius:999px;background:#102638;color:#d7ebdf;font-size:10px;font-weight:700;letter-spacing:.015em;white-space:nowrap;touch-action:manipulation}
.sound-note{font-size:18px;line-height:1;color:#e9d39d}
.sound-toggle.is-muted{color:#8196a6;border-color:#425263;background:#0a1625}
.sound-toggle.is-muted .sound-note{color:#8196a6}
@media(max-width:340px){.top-controls{gap:4px}.sound-toggle{min-width:46px;padding:0 5px}.brand{font-size:11px;letter-spacing:.15em}}

/* v1.0 Fruit tiers: no copyrighted character art. Simple inline SVG symbols. */
.choose{width:min(100%,430px)}
.choose-heading{color:#d0d4c5;font-size:13px;letter-spacing:.08em;margin:7px 0 14px}
.levels{gap:10px}
.fruit-level{position:relative;min-height:147px;padding:12px 4px 11px;gap:4px;border-radius:17px;overflow:hidden;box-shadow:inset 0 1px 0 #ffffff13,0 7px 20px #0005;touch-action:manipulation}
.fruit-level::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 30%,var(--fruit-glow),transparent 76%);opacity:.18;transition:opacity .25s}
.fruit-level:hover::before,.fruit-level:focus-visible::before{opacity:.36}
.fruit-0{--fruit-glow:#f9d34b;border-color:#a1894c99}.fruit-1{--fruit-glow:#ffb25a;border-color:#b98e5d99}.fruit-2{--fruit-glow:#e54c70;border-color:#a6738599}
.fruit-medallion{position:relative;display:grid;place-items:center;width:75px;height:75px;margin-bottom:1px;border-radius:50%;border:1px solid #e4dbb133;background:radial-gradient(circle at 48% 32%,#ffffff1c,#14283824 65%,#05132045 100%);box-shadow:inset 0 0 14px #0004,0 0 19px #d3e8da12}
.fruit-svg{width:67px;height:67px;overflow:visible;filter:drop-shadow(0 5px 4px #0006)}
.fruit-name{font:700 clamp(10px,2.7vw,13px)/1.3 system-ui,sans-serif;letter-spacing:.05em;color:#f4e8c7;white-space:nowrap}
.fruit-description{font-size:11px;color:#b7cbd0;letter-spacing:.04em}
.level.fruit-level:active{transform:scale(.95)}
@media(max-height:760px){.fruit-level{min-height:123px;padding:6px 3px}.fruit-medallion{width:60px;height:60px}.fruit-svg{width:55px;height:55px}.glyph-stage{width:min(100%,285px)}}
@media(max-width:360px){.levels{gap:6px}.fruit-level{min-height:128px}.fruit-medallion{width:61px;height:61px}.fruit-svg{width:55px;height:55px}.fruit-name{font-size:10px}}

/* v1.3: shared Japanese glyph shapes and touch-friendly kanji size.
   Internet is needed for the Google-hosted font; offline falls back to Mincho. */
.headline h1,.glyph-title span:first-child,.result-box h2,
.result-heading h2,.practice-title{font-family:var(--kanji-face)}
.kanji-node{font-feature-settings:"palt" 0; /* preserve full-width kanji proportions */}
.glyph-pick .glyph,.study-chip .symbol{font-feature-settings:"palt" 0}
@media (max-width:340px){.kanji-node{font-size:clamp(29px,9.5vw,34px)}}

  </main>
  <footer class="footer">JLOS · 五芒星 · 50 SORU / 50問</footer>

const starRoute=[0,2,4,1,3]; // One stroke to each of the five vertices, clockwise through the pentagram.
function magicDiagram(){
  const ringTicks=Array.from({length:48},(_,i)=>`<line x1="200" y1="26" x2="200" y2="${i%4===0?40:33}" transform="rotate(${i*7.5} 200 200)" stroke="${i%4===0?'#b9d5d0':'#6b97a8'}" stroke-width="${i%4===0?1.5:.7}" opacity=".5"/>`).join('');
  const gems=Array.from({length:10},(_,i)=>`<path d="M200 42 l4 4 -4 4 -4 -4Z" transform="rotate(${i*36} 200 200)" fill="none" stroke="#d9ccaa" stroke-width=".8" opacity=".65"/>`).join('');
  return `<svg class="diagram" viewBox="0 0 400 400" aria-hidden="true">
    <defs><radialGradient id="aura"><stop stop-color="#6db5c1" stop-opacity=".12"/><stop offset=".65" stop-color="#17465d" stop-opacity=".06"/><stop offset="1" stop-color="#1c506c" stop-opacity="0"/></radialGradient></defs>
    <circle cx="200" cy="200" r="195" fill="url(#aura)"/>
    <g class="ring-spin">${ringTicks}<circle class="halo" cx="200" cy="200" r="163"/><circle class="halo" cx="200" cy="200" r="175" stroke-dasharray="2 9"/></g>
    <g class="ring-spin-back">${gems}<circle class="halo" cx="200" cy="200" r="153" stroke-dasharray="35 7"/></g>
    <polygon points="${points.map(p=>p.join(',')).join(' ')}" class="edge"/>
    <path d="M200 66 L279 310 L72 159 L328 159 L121 310 Z" class="star pulse"/>
    <g class="star-light-lines">${starRoute.map((vertex,k)=>{const to=starRoute[(k+1)%5];return `<path class="star-trace" pathLength="100" d="M${points[vertex][0]} ${points[vertex][1]} L${points[to][0]} ${points[to][1]}"/>`}).join('')}</g>
    <circle cx="200" cy="200" r="65" class="center-figure"/><circle cx="200" cy="200" r="43" class="halo"/>
    <path d="M200 157 L243 200 L200 243 L157 200 Z" class="center-figure"/>
    ${points.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#d8d8c0" opacity=".75"/>`).join('')}
  </svg>`
}

      $('status').textContent=t().correct;
      $('explanation').textContent=q[language];
      $('next').textContent=index===4?t().finish:t().next;
      $('next').classList.remove('hide');
      records[index].solved=true;
      solved=true;
      moving=false;
    },travel+activation);
  }else{
    later(()=>{
      $('kanjiStage').classList.remove('stage-activating');
      button.classList.add('rejected');
      $('kanjiStage').classList.add('stage-rejected');
      $('status').textContent=t().wrong;
      playEffect('fail');
    },travel+activation);
    later(()=>{
      button.classList.remove('to-center','rejected');
      $('kanjiStage').classList.remove('stage-thinking','stage-rejected');
    },travel+activation+300);
    later(()=>{
      document.querySelectorAll('.kanji-node').forEach(b=>b.disabled=false);
      moving=false;
    },travel+activation+(reduce?80:1080));
  }
}
function getSelectedKanji(){
 const seen=new Set(),items=[];
 questions[level].forEach((q,qi)=>{
  q.a.forEach((symbol,i)=>{
   if(unknown.has(`${qi}:${i}`) && !seen.has(symbol)){
    seen.add(symbol);items.push({symbol,gloss:glosses[level][qi][i][0],reading:glosses[level][qi][i][1],jpMeaning:jpMeanings[level][qi][i]});
   }
  });
 });
 return items;
}
function renderStudyList(){
 const d=resultText[language],items=getSelectedKanji();
 $('studyTitle').textContent=d.unknownTitle;
 $('studyList').innerHTML=items.length?`<div class="study-kanji-list">${items.map(item=>`<div class="study-chip"><span class="symbol">${escapeHTML(item.symbol)}</span><span class="gloss">${escapeHTML(language==='tr'?item.gloss:item.reading)}</span></div>`).join('')}</div>`:`<div class="study-empty">${escapeHTML(d.noUnknown)}</div>`;
 $('startPractice').disabled=items.length===0;
 $('startPractice').textContent=`${d.practiceStart}${items.length?' · '+items.length:''}`;
}
function renderCards(){
 const d=resultText[language];
 $('reviewTitle').textContent=d.review;
 $('reviewCount').textContent=`5 ${d.question}`;
 $('tapHint').textContent=d.tap;
 $('reviewCards').innerHTML=questions[level].map((q,qi)=>{
  const record=records[qi];if(!record)return '';
  const order=record.originalOrder;
  return `<article class="review-card">
    <div class="card-top"><span class="card-number">QUESTION 0${qi+1}</span><span class="card-result"><span class="dot">✧</span>${escapeHTML(d.rightAnswer)}：<strong>${escapeHTML(q.a[q.o])}</strong></span></div>
    <div class="glyph-picks">${order.map(orig=>{
     const symbol=q.a[orig],marked=unknown.has(`${qi}:${orig}`),isAnswer=orig===q.o;
     const gloss=glosses[level][qi][orig][language==='tr'?0:1];
     return `<button type="button" class="glyph-pick ${marked?'is-unknown':''} ${isAnswer?'is-answer':''}" data-q="${qi}" data-char="${orig}" aria-pressed="${marked}" aria-label="${escapeHTML(symbol)}: ${escapeHTML(gloss)}"><span class="pick-mark">${marked?'✦':'+'}</span><span class="glyph">${escapeHTML(symbol)}</span><span class="gloss">${escapeHTML(gloss)}</span></button>`;
    }).join('')}</div>
    <div class="card-reason"><b>${escapeHTML(d.reason)}：</b>${escapeHTML(q[language])}</div>
   </article>`;
 }).join('');
 $('reviewCards').querySelectorAll('.glyph-pick').forEach(b=>b.addEventListener('click',()=>{
  const key=`${b.dataset.q}:${b.dataset.char}`;
  if(unknown.has(key))unknown.delete(key);else unknown.add(key);
  const marked=unknown.has(key);
  b.classList.toggle('is-unknown',marked);b.setAttribute('aria-pressed',String(marked));b.querySelector('.pick-mark').textContent=marked?'✦':'+';
  renderStudyList();
 }));
}
function resultRender(){
 const d=resultText[language];
 $('resultTitle').textContent=d.title;
 $('resultIntro').textContent=d.intro;
 $('previewBadge').classList.toggle('hide',!preview);
 $('previewBadge').textContent=d.demo;
 $('replay').textContent=d.again;
 $('again').textContent=d.home;
 renderCards();renderStudyList();
}
function startPractice(){
 practiceQueue=getSelectedKanji();
 if(practiceQueue.length===0)return;
 practiceDone=false;practiceRevealed=false;
 show('practice');practiceRender();
}
function practiceAnswerText(item){
 if(language==='tr')return item.gloss;
 return `${item.jpMeaning}（${item.reading}）`;
}
function practiceRender(){
 const d=resultText[language];
 $('practiceTitle').textContent=practiceDone?d.practiceDone:d.practiceTitle;
 $('practiceInstruction').textContent=practiceDone?d.doneMessage:d.practiceHint;
 $('practiceBack').textContent=d.backToReview;
 $('practiceProgress').textContent=practiceDone?'':`${practiceQueue.length} ${d.remaining}`;
 if(practiceDone){
  $('practiceCard').innerHTML='<div class="practice-done-icon" aria-hidden="true">✧</div>';
  $('practiceControls').innerHTML=`<button type="button" class="primary full" id="practiceAgain">${escapeHTML(d.againPractice)}</button>`;
  $('practiceAgain').addEventListener('click',startPractice);
  return;
 }
 const item=practiceQueue[0];
 $('practiceCard').innerHTML=`<div class="practice-glyph">${escapeHTML(item.symbol)}</div><div class="practice-answer ${practiceRevealed?'':'is-hidden'}" id="practiceAnswer"><span class="practice-answer-label">${escapeHTML(d.answerLabel)}</span>${escapeHTML(practiceAnswerText(item))}</div>`;
 $('practiceControls').innerHTML=practiceRevealed?
  `<button type="button" class="secondary-button" id="practiceRepeat">${escapeHTML(d.repeat)}</button><button type="button" class="primary" id="practiceKnown">${escapeHTML(d.remembered)}</button>`:
  `<button type="button" class="primary full" id="practiceReveal">${escapeHTML(d.reveal)}</button>`;
 if(practiceRevealed){
  $('practiceRepeat').addEventListener('click',()=>practiceNext(false));
  $('practiceKnown').addEventListener('click',()=>practiceNext(true));
 }else $('practiceReveal').addEventListener('click',()=>{practiceRevealed=true;practiceRender()});
}
function practiceNext(remembered){
 const item=practiceQueue.shift();
 if(!remembered)practiceQueue.push(item);
 practiceRevealed=false;
 if(practiceQueue.length===0)practiceDone=true;
 practiceRender();
}
function finishSession(){durationMs=Date.now()-sessionStart;preview=false;show('result');resultRender();playEffect('finish')}
function previewSession(){
 if(!questions[0].length)buildSession(0);
 level=0;index=0;preview=true;durationMs=42000;unknown=new Set(['0:0','1:4']);
 records=questions[0].map((q,qi)=>({originalOrder:[...Array(5).keys()].sort((a,b)=>((a+qi)%5)-((b+qi)%5)),firstChoice:qi===1?0:q.o,attempts:qi===1?2:1,solved:true}));
 show('result');resultRender();
}
$('next').addEventListener('click',()=>{if(!solved)return;if(index===4){finishSession()}else {index++;solved=false;newQuestionOrder();gameRender();playEffect('next')}});
$('back').addEventListener('click',()=>{show('home');languageRender()});
$('again').addEventListener('click',()=>{show('home');languageRender()});
$('replay').addEventListener('click',()=>start(level));

$('startPractice').addEventListener('click',startPractice);
$('practiceBack').addEventListener('click',()=>{show('result');resultRender()});
$('tr').addEventListener('click',()=>{language='tr';languageRender()});$('ja').addEventListener('click',()=>{language='ja';languageRender()});
languageRender();
</script>
</body>
</html>
