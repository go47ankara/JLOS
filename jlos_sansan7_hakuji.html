<style>
:root{color-scheme:dark;font-family:system-ui,'Noto Sans JP',sans-serif}*{box-sizing:border-box}body{margin:0;background:#080f20;color:white}main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:18px 12px 24px;gap:10px}header{text-align:center;z-index:4}h1{font-size:clamp(24px,6vw,35px);margin:2px 0}small,.hint{color:#bec9dd}#stage{position:relative;overflow:hidden;width:min(100%,640px);height:min(63dvh,500px);min-height:320px;background:#101b35;border:1px solid #354361;border-radius:22px;isolation:isolate;transition:background-color .1s linear}#sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;clip-path:inset(0 0 13px 0)}#stage::after{content:'';position:absolute;left:0;right:0;bottom:0;height:13px;background:inherit;z-index:2;pointer-events:none}#flash{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:0;background:#fff}#glyphs{position:absolute;inset:0;z-index:2;pointer-events:none} .burst-glyph{position:absolute;left:50%;top:44%;font-weight:850;font-size:var(--font-size,clamp(42px,10vw,74px));color:#fff4dc;text-shadow:0 0 8px #fff,0 0 22px #ffc765,0 3px 2px #111;transform:translate(-50%,-50%) scale(.3);opacity:0;white-space:nowrap}.burst-glyph.show{animation:flower .34s cubic-bezier(.13,.85,.2,1.2) forwards}.burst-glyph.fade{animation:flicker 1.3s linear forwards;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1)}@keyframes flower{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}65%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1);opacity:1}}@keyframes flicker{0%,30%{opacity:1}36%{opacity:.12}46%{opacity:1}59%{opacity:.18}70%{opacity:1}100%{opacity:0;filter:blur(8px)}}#center{position:absolute;inset:0;display:grid;place-items:center;z-index:3;pointer-events:none}#single{font-size:clamp(125px,35vw,215px);font-weight:850;line-height:1;text-shadow:0 4px 20px #0008;opacity:0}#single.visible{opacity:1}#mortar{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:30px;height:26px;z-index:4;pointer-events:none}#mortar::before{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%) perspective(40px) rotateX(24deg);width:16px;height:18px;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,#2b3546 0%,#161d28 58%,#0a0f17 100%);border:1px solid #465166;box-shadow:0 2px 0 #0a0f18,inset 0 1px 0 #72809b55}#mortar::after{content:'';position:absolute;left:50%;top:2px;transform:translateX(-50%);width:12px;height:5px;border-radius:50%;background:#0b111a;border:1px solid #5c6880;box-shadow:inset 0 0 0 1px #0f1724}#mortar .mortar-flash{position:absolute;left:50%;top:-2px;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#fff6bf 0%,#ffd86f 35%,#ffb54f88 60%,#0000 75%);opacity:0;transition:opacity .12s ease;filter:blur(.3px)}#mortar.launching .mortar-flash{animation:mortarIgnition .40s ease-out forwards}@keyframes mortarIgnition{0%{opacity:0;transform:translateX(-50%) scale(.6)}16%{opacity:1;transform:translateX(-50%) scale(1.65)}100%{opacity:0;transform:translateX(-50%) scale(2)}}#status{position:absolute;left:12px;right:12px;bottom:53px;text-align:center;z-index:4;font-size:clamp(16px,3vw,22px);font-weight:700;text-shadow:0 2px 6px #000}#controls{width:min(100%,640px);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}button,select{border-radius:12px;border:1px solid #536882;background:#1b3051;color:white;padding:12px 16px;font-size:16px;cursor:pointer}button.primary{background:#f2b84a;border-color:#ffe0a0;color:#18233d;font-weight:800;font-size:19px}button:disabled{opacity:.45;cursor:default}#level{max-width:min(88vw,330px);font-size:14px}label{font-size:14px;color:#ccd8e8;display:flex;gap:7px;align-items:center}select{padding:8px}#result{font-size:18px;text-align:center;min-height:27px}.hint{text-align:center;font-size:13px;max-width:620px;margin:0}body.quiet #stage{transition:none}@media(max-height:690px){#stage{height:52dvh;min-height:260px}main{gap:6px;padding:8px}#single{font-size:125px}}@media(prefers-reduced-motion:reduce){.burst-glyph.show{animation-duration:.01s}.burst-glyph.fade{animation:none;opacity:0}}

#positions{position:absolute;inset:0;z-index:5;pointer-events:none}
.position{position:absolute;left:50%;top:44%;width:clamp(52px,13vw,76px);height:clamp(52px,13vw,76px);border-radius:50%;border:2px solid #f9cf70;background:rgba(24,45,80,.94);box-shadow:0 0 20px #e5b84d55, inset 0 0 12px #9bbaff22;color:#fff;font-size:clamp(23px,6vw,35px);font-weight:850;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y)));pointer-events:auto;display:grid;place-items:center;padding:0;touch-action:manipulation}
.position:focus-visible{outline:3px solid white;outline-offset:4px}
.position.correct{background:#156a55;border-color:#90ffcf}
.position.wrong{background:#923e44;border-color:#ffaaa3}
.position:disabled{opacity:1;cursor:default}

[hidden]{display:none!important}
.topnav{width:min(100%,940px);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.language-controls{display:flex;gap:5px;align-items:center}.lang-switch{background:transparent;color:#c5d6eb;border:1px solid #708eb5;border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:700;min-height:38px;font-size:12px}.lang-switch.active{background:#dceaff;color:#064bb6;border-color:#90b9f9}.lang-switch:focus-visible{outline:3px solid #ffc45c;outline-offset:2px}.topnav a{color:#a7cfff;text-decoration:none;font-size:13px}

.mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.mode-card{padding:0;text-align:left;overflow:hidden;border-radius:18px;background:#192b49;border:1px solid #425b80;display:flex;flex-direction:column;min-width:0;box-shadow:0 10px 25px #0004;transition:transform .16s,border-color .16s;touch-action:manipulation}.mode-card:hover{transform:translateY(-3px);border-color:#ffda82}.mode-card:active{transform:scale(.98)}.mode-card:focus-visible{outline:3px solid #ffdd8f;outline-offset:4px}
.mode-photo{height:clamp(125px,20vw,190px);display:block;position:relative;overflow:hidden;background:radial-gradient(circle,#eaba74 0%,#28476d 35%,#0a1830 75%)}.mode-photo img{display:block;width:100%;height:100%;object-fit:cover}.mode-grade{position:absolute;left:12px;top:12px;background:#05182cd9;color:#ffe2a4;border:1px solid #fff3;border-radius:7px;padding:5px 8px;font:800 10px system-ui;letter-spacing:.08em}.mode-body{display:flex;flex-direction:column;padding:16px;gap:6px}.mode-body strong{font-size:clamp(16px,2.2vw,21px);line-height:1.25}.mode-body>span{font-size:13px;color:#c2d5ed}.mode-body em{font-style:normal;color:#ffd279;font-weight:800;font-size:13px;margin-top:10px}.photo-credit{font-size:10px;color:#8097b6;margin:14px auto 0}.photo-credit a{color:#9cbbe9}.options{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:20px;flex-wrap:wrap}.options label{cursor:pointer}.options button{font-size:13px;padding:9px 12px}
#gameScreen{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}.gamebar{width:min(100%,640px);display:flex;justify-content:space-between;align-items:center;gap:8px}.gamebar button{font-size:13px;padding:8px 10px}.gamebar span{font-size:13px;color:#d7e6fc;font-weight:800}#controls{margin-top:3px}#start{display:none}#controls.can-retry #start{display:block}
@media(max-width:610px){.mode-grid{grid-template-columns:1fr;gap:12px;width:min(100%,430px);margin:auto}.mode-card{display:grid;grid-template-columns:44% 56%;min-height:136px}.mode-photo{height:100%;min-height:136px}.mode-body{padding:14px}.mode-body strong{font-size:18px}.mode-body em{margin-top:5px}#stage{height:min(62dvh,470px)}}

  植物:'花草木竹松梅桜葉根実',
  動物:'犬猫馬牛羊鳥魚虫虎象',
  感情:'愛喜怒哀楽悲恐恨恋憎',
  身体:'目耳口手足頭顔首指鼻',
  生活:'家門窓庭道車駅店町村',
  色彩:'赤青白黒黄緑紫紅灰茶',
  時間:'朝昼夜夕春夏秋冬今昔'
};
const pattern=[4,4,7],total=15;
let running=false,answer='',answered=false,timers=[],particles=[],rocket=null,audio=null,noiseBuffer=null,anim=0,run=0;
function schedule(fn,ms){const id=setTimeout(fn,ms);timers.push(id)}
function fit(){let r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',fit);fit();
function rnd(n){return Math.floor(Math.random()*n)}function sample(){const names=Object.keys(categories);const category=names[rnd(names.length)];let a=[...categories[category]];for(let i=a.length-1;i>0;i--){let j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,Number(level.value))}
function getAudio(){if(!sound.checked)return null;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}catch{return null}}
function drum(accent=false){
 const a=getAudio();if(!a)return;
 const t=a.currentTime, length=.23;
 // 和太鼓風：低音の膜振動 + 短い皮のアタック（ノイズ）
 const osc=a.createOscillator(),gain=a.createGain();
 osc.type='sine';osc.frequency.setValueAtTime(accent?175:145,t);osc.frequency.exponentialRampToValueAtTime(accent?65:56,t+.115);
 gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(accent?.8:.62,t+.004);
 gain.gain.exponentialRampToValueAtTime(.0001,t+length);
 osc.connect(gain).connect(a.destination);osc.start(t);osc.stop(t+length+.01);
 if(!noiseBuffer){noiseBuffer=a.createBuffer(1,Math.round(a.sampleRate*.22),a.sampleRate);const data=noiseBuffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)}
 const noise=a.createBufferSource(),filter=a.createBiquadFilter(),ng=a.createGain();noise.buffer=noiseBuffer;
 filter.type='lowpass';filter.frequency.value=accent?1000:750;
 ng.gain.setValueAtTime(accent?.33:.21,t);ng.gain.exponentialRampToValueAtTime(.0001,t+.07);
 noise.connect(filter).connect(ng).connect(a.destination);noise.start(t);noise.stop(t+.085);
}
function clack(){
 const a=getAudio();if(!a)return;const t=a.currentTime;
 // 二本のバチを合わせる乾いた「カッ」：短い高域ノイズ＋硬い打音
 const n=a.createBuffer(1,Math.round(a.sampleRate*.065),a.sampleRate),v=n.getChannelData(0);
 for(let i=0;i<v.length;i++)v[i]=(Math.random()*2-1)*Math.exp(-i/(a.sampleRate*.009));
 const src=a.createBufferSource(),hp=a.createBiquadFilter(),g=a.createGain();src.buffer=n;hp.type='highpass';hp.frequency.value=1600;
 g.gain.setValueAtTime(.42,t);g.gain.exponentialRampToValueAtTime(.0001,t+.045);
 src.connect(hp).connect(g).connect(a.destination);src.start(t);src.stop(t+.06);
 const o=a.createOscillator(),og=a.createGain();o.type='triangle';o.frequency.value=1250;
 og.gain.setValueAtTime(.16,t);og.gain.exponentialRampToValueAtTime(.0001,t+.025);
 o.connect(og).connect(a.destination);o.start(t);o.stop(t+.03);
}
let stopLaunchSound=()=>{};
function whoosh(){
 const a=getAudio();if(!a){stopLaunchSound=()=>{};return}
 const t=a.currentTime;
 // 打ち上げ花火の高く細い笛音 + ごく軽い空気の擦れる音。
 // 上昇終了時に音を止めるので端末の描画速度とも同期する。
 const tone=a.createOscillator(),toneGain=a.createGain();
 tone.type='sine';
 tone.frequency.setValueAtTime(1450,t);
 tone.frequency.exponentialRampToValueAtTime(2550,t+2.7);
 toneGain.gain.setValueAtTime(.0001,t);
 toneGain.gain.linearRampToValueAtTime(.032,t+.13);
 toneGain.gain.linearRampToValueAtTime(.027,t+2.7);
 tone.connect(toneGain).connect(a.destination);
 // 柔らかな息・噴射音を重ねて、電子音らしい輪郭を消す。
 const dur=4.5,buf=a.createBuffer(1,Math.ceil(a.sampleRate*dur),a.sampleRate),v=buf.getChannelData(0);
 for(let i=0;i<v.length;i++)v[i]=(Math.random()*2-1);
 const wind=a.createBufferSource(),bp=a.createBiquadFilter(),windGain=a.createGain();
 wind.buffer=buf;bp.type='bandpass';bp.Q.value=1.7;
 bp.frequency.setValueAtTime(2600,t);bp.frequency.linearRampToValueAtTime(3900,t+2.7);
 windGain.gain.setValueAtTime(.0001,t);
 windGain.gain.linearRampToValueAtTime(.008,t+.13);
 windGain.gain.setValueAtTime(.008,t+2.7);
 wind.connect(bp).connect(windGain).connect(a.destination);
 tone.start(t);wind.start(t);
 let stopped=false;
 stopLaunchSound=()=>{
  if(stopped)return;stopped=true;
  const end=a.currentTime+.055;
  toneGain.gain.cancelScheduledValues(a.currentTime);
  windGain.gain.cancelScheduledValues(a.currentTime);
  toneGain.gain.setValueAtTime(.027,a.currentTime);
  windGain.gain.setValueAtTime(.008,a.currentTime);
  toneGain.gain.linearRampToValueAtTime(.0001,end);
  windGain.gain.linearRampToValueAtTime(.0001,end);
  try{tone.stop(end+.02);wind.stop(end+.02)}catch{}
 };
 // 非常時も鳴りっぱなしにしない。
 const stopThisSound=stopLaunchSound;setTimeout(()=>{if(!stopped)stopThisSound()},3900);
}
function boom(){drum(true);schedule(()=>drum(false),75)}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);if(rocket){if(rocket.phase==='rise'){rocket.y-=rocket.v;ctx.strokeStyle='rgba(255,182,81,.55)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(rocket.x,rocket.y+10);ctx.lineTo(rocket.x,rocket.y+58);ctx.stroke();ctx.strokeStyle='rgba(255,236,188,.28)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(rocket.x,rocket.y+18);ctx.lineTo(rocket.x,rocket.y+78);ctx.stroke();if(rocket.y<=rocket.target){rocket.phase='pause';stopLaunchSound();rocket.pauseUntil=performance.now()+300;status.textContent='';mortar.classList.remove('launching');}}ctx.fillStyle='#ffedbc';ctx.beginPath();ctx.arc(rocket.x,rocket.y,4.8,0,7);ctx.fill();if(rocket.phase==='pause'&&performance.now()>=rocket.pauseUntil){rocket=null;explode(w/2,h*.38);}}particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.026;p.life--;ctx.globalAlpha=Math.min(1,p.life/22);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;if(rocket||particles.length)anim=requestAnimationFrame(draw);else anim=0}
function ensureDraw(){if(!anim)anim=requestAnimationFrame(draw)}
function addBurst(x,y,count,spread,colors,style='round'){
 const w=canvas.clientWidth,h=canvas.clientHeight;
 for(let i=0;i<count;i++){
  let angle=Math.PI*2*i/count + (Math.random()-.5)*.045;
  let speed=(2.0+Math.random()*1.0)*spread;
  if(style==='ring') speed=(2.7+Math.random()*.3)*spread;
  particles.push({x:Math.max(15,Math.min(w-15,x)),y:Math.max(20,Math.min(h-20,y)),vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:38+rnd(22),c:colors[i%colors.length],size:(style==='ring'?1.5:2)+Math.random()*1.3});
 }
 ensureDraw();
}
function explode(x,y){
 const lv=Number(level.value),w=canvas.clientWidth,h=canvas.clientHeight;
 // 厚狭＝一輪、関門＝二段咲き、長岡＝大輪＋左右の連続花火。
 // 漢字の前面は常に保護し、花火はキャンバスの背景に描画する。
 if(lv===3){
  addBurst(x,y,75,1.18,['#ffdc83','#ffc75b','#fff2b9']);
 }else if(lv===5){
  addBurst(x,y,125,1.65,['#ffe89a','#ff91c6','#8ddff9','#9fffd4','#ffc17e']);
  schedule(()=>addBurst(x,y,90,.87,['#fff2b9','#ffffff','#83e2ff'],'ring'),220);
 }else{
  addBurst(x,y,190,2.25,['#ffbace','#fff1b4','#8bd6ff','#98ffe2']);
  schedule(()=>addBurst(x,y,150,1.15,['#ffffff','#ffe996','#ffa6ed'],'ring'),160);
  schedule(()=>addBurst(w*.24,h*.27,115,1.22,['#86daff','#d9bbff','#ffffff']),260);
  schedule(()=>addBurst(w*.76,h*.27,115,1.22,['#ffd17c','#ff9fbc','#ffffff']),400);
 }
 boom();flash.style.opacity=lv===7?'.83':lv===5?'.65':'.48';schedule(()=>flash.style.opacity='0',100);
 showFlower();ensureDraw();
}
function showFlower(){const choices=window.currentChoices;mortar.classList.remove('launching');glyphs.innerHTML='';const r=Math.min(stage.clientWidth*.29,stage.clientHeight*.31,118);glyphs.style.setProperty('--font-size',choices.length===7?'clamp(32px,8vw,58px)':'clamp(42px,10vw,74px)');choices.forEach((c,i)=>{const angle=-Math.PI/2+2*Math.PI*i/choices.length,g=document.createElement('span');g.className='burst-glyph';g.textContent=c;g.style.setProperty('--x',(Math.cos(angle)*r).toFixed(1)+'px');g.style.setProperty('--y',(Math.sin(angle)*r).toFixed(1)+'px');glyphs.appendChild(g);requestAnimationFrame(()=>g.classList.add('show'))});status.textContent='';
// 開花の0.34秒後から計測。長岡だけ1.5秒静止＋1.5秒点滅、他は0.7秒＋1.3秒。
const nagaoka=choices.length===7;
const clearMs=nagaoka?1500:700;
const blinkMs=nagaoka?1500:1300;
schedule(()=>{glyphs.querySelectorAll('span').forEach(g=>{g.classList.remove('show');g.style.animationDuration=blinkMs+'ms';g.classList.add('fade')})},340+clearMs);
schedule(()=>{glyphs.innerHTML='';status.textContent='';schedule(()=>beginRhythm(run),220)},340+clearMs+blinkMs)}
const beats=[
 ...Array.from({length:3},()=>({type:'don',group:0})),{type:'ka',group:0},
 ...Array.from({length:3},()=>({type:'don',group:1})),{type:'ka',group:1},
 ...Array.from({length:6},()=>({type:'don',group:2})),{type:'ka-final',group:2}
];
function beginRhythm(id){
 if(id!==run)return;
 const ms=400,seq=[];
 // 13回の文字表示（ドン12回＋最後のカッ1回）で、直前と同じ字は出さない
 for(let n=0;n<13;n++){const candidates=window.currentChoices.filter(c=>c!==seq[n-1]);seq.push(candidates[rnd(candidates.length)])}
 answer=seq[12];let i=0,shown=0;
 const colors=['#213b7c','#087c73','#a04428'];
 function beat(){
  if(id!==run)return;
  if(i>=beats.length){single.classList.remove('visible');single.textContent='';stage.style.background='#101b35';status.textContent=tr('where');running=false;showPositions(id);return}
  const b=beats[i],last=b.type==='ka-final',ka=b.type!=='don';stage.style.background=ka?(b.group===0?'#734b31':b.group===1?'#53633b':'#8a392f'):colors[b.group];
  single.classList.remove('visible');single.textContent='';
  if(!ka||last){single.textContent=seq[shown++];single.classList.add('visible')}
  
  status.textContent='';
  if(ka)clack();else drum();
  // 字は各拍の前半のみ。最後のカッも表示時間は同じ。
  const here=i;const displayMs=last?500:Math.min(ms*.7,430);
  schedule(()=>{if(id===run&&i===here+1){single.classList.remove('visible');single.textContent=''}},displayMs);
  i++;schedule(beat,last?Math.max(ms,500):ms);
 }
 beat();
}

function showPositions(id){
 if(id!==run)return;
 positions.innerHTML='';answered=false;
 const choices=window.currentChoices;
 const r=Math.min(stage.clientWidth*.29,stage.clientHeight*.31,118);
 choices.forEach((char,i)=>{
  const angle=-Math.PI/2+2*Math.PI*i/choices.length;
  const b=document.createElement('button');b.type='button';b.className='position';b.textContent='？';
  b.setAttribute('aria-label',tr('pos',{n:i+1}));
  b.style.setProperty('--x',(Math.cos(angle)*r).toFixed(1)+'px');
  b.style.setProperty('--y',(Math.sin(angle)*r).toFixed(1)+'px');
  b.addEventListener('click',()=>{
   if(answered||id!==run)return;
   answered=true;
   const correct=choices.indexOf(answer);
   [...positions.children].forEach((node,k)=>{node.textContent=choices[k];node.disabled=true;if(k===correct)node.classList.add('correct');if(k===i&&i!==correct)node.classList.add('wrong')});
   result.textContent=i===correct?tr('correct'):tr('wrong',{char:answer});
   status.textContent=tr('retry');
   start.disabled=false;level.disabled=false;controls.classList.add('can-retry');
   if(i===correct){
    const x=stage.clientWidth/2+Math.cos(-Math.PI/2+2*Math.PI*i/choices.length)*r;
    const y=stage.clientHeight*.44+Math.sin(-Math.PI/2+2*Math.PI*i/choices.length)*r;
    const lv=choices.length;
    if(lv===7){
     // 長岡だけの正解フィナーレ：七色の連続大輪＋金色の一斉開花。
     // 答えの文字は前景に残し、打ち上げ直後の記憶課題には干渉しない。
     result.textContent=tr('finale');
     const w=stage.clientWidth,h=stage.clientHeight;
     const big=['#ffe6a0','#fff7d6','#ffa4ca','#8fdfff','#a8ffe4'];
     const gold=['#ffd15c','#ffe89a','#fff5cd','#ffb947'];
     addBurst(x,y,145,1.6,big);boom();
     flash.style.opacity='.55';schedule(()=>flash.style.opacity='0',120);
     const shows=[
      [180,.22,.30,110,1.25,['#91d7ff','#b0f9ff','#ffffff']],
      [320,.78,.29,110,1.25,['#ff9ac6','#ffd7ed','#ffffff']],
      [500,.50,.18,155,1.65,['#ffe99d','#ffffff','#a5ffd7']],
      [720,.12,.54,92,1.1,['#ffc37d','#ffe99f','#ffffff']],
      [850,.88,.53,92,1.1,['#bdacff','#91e1ff','#ffffff']],
      [1040,.34,.43,115,1.12,gold],
      [1160,.66,.43,115,1.12,gold],
      [1300,.50,.39,155,1.5,gold]
     ];
     shows.forEach(([delay,px,py,count,spread,colors],j)=>schedule(()=>{
      if(id!==run)return;
      addBurst(w*px,h*py,count,spread,colors,j===7?'ring':'round');
      if(j===2||j===7)boom();
     },delay));
    }else{
     // 厚狭・関門は従来の正解エフェクトを維持。
     addBurst(x,y,125,1.75,['#ffe67a','#ff98cf','#87e7ff','#a5ffd7','#ffffff']);
     flash.style.opacity='.35';schedule(()=>flash.style.opacity='0',105);boom();
     schedule(()=>{if(id===run)addBurst(x,y,85,.92,['#ffffff','#ffe89a','#83e4ff'],'ring')},180);
     schedule(()=>{if(id===run)addBurst(Math.max(60,x-65),Math.max(75,y-45),66,1.0,['#ffb4d5','#fff2ae'])},290);
     schedule(()=>{if(id===run)addBurst(Math.min(stage.clientWidth-60,x+65),Math.max(75,y-45),66,1.0,['#90ddff','#d8c3ff'])},420);
    }
   }
  });
  positions.appendChild(b);
 });
}
function launch(){controls.classList.remove('can-retry');stopLaunchSound();mortar.classList.remove('launching');run++;const id=run;timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(anim);anim=0;running=true;particles=[];rocket=null;glyphs.innerHTML='';single.classList.remove('visible');single.textContent='';answer='';answered=false;positions.innerHTML='';start.disabled=true;level.disabled=true;result.textContent='';stage.style.background='#101b35';status.textContent='';getAudio();whoosh();window.currentChoices=sample();rocket={x:canvas.clientWidth/2,y:canvas.clientHeight-33,target:canvas.clientHeight*.38,v:Math.max(2.1,canvas.clientHeight/180),phase:'rise',pauseUntil:0};mortar.classList.add('launching');schedule(()=>{if(id===run)mortar.classList.remove('launching')},420);ensureDraw();}
document.querySelectorAll('.mode-card').forEach(card=>card.addEventListener('click',()=>{
 level.value=card.dataset.level;
 playingLevel.textContent=card.querySelector('strong').textContent;
 modeScreen.hidden=true;gameScreen.hidden=false;
 fit();launch();
}));
backModes.addEventListener('click',()=>{
 stopLaunchSound();run++;timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(anim);anim=0;running=false;rocket=null;particles=[];mortar.classList.remove('launching');positions.innerHTML='';glyphs.innerHTML='';
 gameScreen.hidden=true;modeScreen.hidden=false;controls.classList.remove('can-retry');
});
soundTest.addEventListener('click',()=>{const original=sound.checked;sound.checked=true;drum();schedule(()=>{sound.checked=true;clack();sound.checked=original},390);sound.checked=original});start.addEventListener('click',launch);let saved='tr';try{saved=localStorage.getItem('jlos_ui_language')||'tr'}catch{}applyLanguage(saved);
})();
</script></body></html>
